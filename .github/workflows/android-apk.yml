name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'Published API base URL, for example https://your-api.example.com'
        required: false
        type: string

permissions:
  contents: read

jobs:
  build-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    env:
      VITE_API_BASE_URL: ${{ inputs.api_base_url || vars.MUNDER_API_BASE_URL || '' }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build web assets
        env:
          PORT: '20976'
          BASE_PATH: /
        run: pnpm --filter @workspace/munder-difflin-mobile run build

      - name: Create Capacitor Android project
        run: pnpm exec cap add android

      - name: Sync Capacitor Android project
        run: pnpm exec cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: munder-difflin-mobile-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error